services:
  api:
    build:
      context: ../../..
      dockerfile: tests/e2e/aiohttp/Dockerfile
    command: ["uv", "run", "python", "-m", "tests.e2e.aiohttp.setup.app"]
    environment:
      AIOHTTP_E2E_HOST: "0.0.0.0"
      AIOHTTP_E2E_PORT: "8230"
    healthcheck:
      test:
        [
          "CMD",
          "uv",
          "run",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8230/health', timeout=3).read()",
        ]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 2s

  tests:
    build:
      context: ../../..
      dockerfile: tests/e2e/aiohttp/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      AIOHTTP_E2E_BASE_HTTP_URL: "http://api:8230"
      AIOHTTP_E2E_BASE_WS_URL: "ws://api:8230"
    command: ["uv", "run", "pytest", "tests/e2e/aiohttp/tests/test_endpoints.py", "-q", "-ra"]
